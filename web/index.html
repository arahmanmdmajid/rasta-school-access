<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoMind AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* ---------- design tokens: every colour is defined for BOTH themes ---------- */
  :root {
    --surface:    #ffffff;
    --surface-2:  #f1f5f9;
    --text:       #0f172a;
    --muted:      #64748b;
    --border:     #e2e8f0;
    --accent:     #1d4ed8;
    --accent-ink: #ffffff;
    --shadow:     0 6px 24px rgba(15, 23, 42, .14);
    --school:     #2563eb;
    --facility:   #e11d48;
    --near:       #059669;
    --isolate:    #d97706;
  }
  [data-theme="dark"] {
    --surface:    #1e293b;
    --surface-2:  #0f172a;
    --text:       #e2e8f0;
    --muted:      #94a3b8;
    --border:     #334155;
    --accent:     #3b82f6;
    --accent-ink: #ffffff;
    --shadow:     0 6px 24px rgba(0, 0, 0, .5);
    --school:     #60a5fa;
    --facility:   #fb7185;
    --near:       #34d399;
    --isolate:    #fbbf24;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
  #map { position: absolute; inset: 0; z-index: 0; background: var(--surface-2); }
  .basemap { transition: opacity .35s ease; }   /* cross-fade between light/dark tiles */
  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); }
  button { font: inherit; cursor: pointer; }

  /* ---------- search ---------- */
  #searchwrap { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: min(460px, calc(100vw - 88px)); z-index: 1200; }
  #searchcard { padding: 12px 14px; transition: box-shadow .2s; }
  #searchcard.pulse { animation: pulse 1.2s ease 2; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent); } }
  #brand h1 { margin: 0 0 9px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  #search { width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none;
    background: var(--surface-2); color: var(--text); transition: border-color .15s; }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent); }
  #suggest { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
  #suggest li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #suggest li:hover { background: var(--surface-2); }
  #suggest small { color: var(--muted); display: block; margin-top: 1px; }
  #quick { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #quick > span { font-size: 12px; color: var(--muted); }
  .qchip { font-size: 12px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); border-radius: 999px; padding: 5px 11px; }
  .qchip:hover { border-color: var(--accent); color: var(--accent); }
  #badge { margin-top: 9px; font-size: 12px; color: var(--muted);
    display: none; align-items: center; gap: 7px; }
  #badge .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .spin { width: 11px; height: 11px; border-radius: 50%; flex: none;
    border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- floating controls ---------- */
  .iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: grid; place-items: center;
    box-shadow: var(--shadow); padding: 0; }
  .iconbtn:hover { border-color: var(--accent); color: var(--accent); }
  #themebtn { position: absolute; top: 14px; right: 14px; z-index: 1200; }

  #legend { position: absolute; left: 14px; bottom: 14px; z-index: 1100;
    padding: 10px 12px; font-size: 12px; display: none; max-width: 220px; }
  #legend .row { display: flex; align-items: center; gap: 7px; }
  #legend .row + .row { margin-top: 5px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #legend i.sq { border-radius: 2px; }
  #legendExtra:not(:empty) { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  /* ---------- chat ---------- */
  #panel { position: absolute; right: 16px; bottom: 16px; z-index: 1150;
    width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 32px); height: 520px;
    display: flex; flex-direction: column; overflow: hidden;
    transition: opacity .2s, transform .2s; }
  #panel.hidden { opacity: 0; transform: translateY(12px) scale(.98); pointer-events: none; }
  #phead { flex: none; padding: 11px 14px; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #phead b { font-size: 14px; } #phead span { display: block; font-size: 11px; opacity: .85; margin-top: 1px; }
  #closechat { background: transparent; border: none; color: var(--accent-ink); opacity: .85;
    padding: 2px; display: grid; place-items: center; border-radius: 6px; }
  #closechat:hover { opacity: 1; background: rgba(255,255,255,.15); }
  #msgs { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px; display: flex;
    flex-direction: column; gap: 9px; background: var(--surface-2); }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 13px; font-size: 13.5px; line-height: 1.5;
    overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .tag { display: block; width: fit-content; max-width: 100%; margin-top: 6px; font-size: 10.5px;
    color: var(--accent); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px; font-family: ui-monospace, monospace; }
  #chips { flex: none; display: flex; flex-wrap: nowrap; gap: 6px; padding: 9px 12px 2px;
    overflow-x: auto; background: var(--surface); scrollbar-width: thin; }
  .chip { flex: none; white-space: nowrap; font-size: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 10px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  #inrow { flex: none; display: flex; gap: 8px; padding: 9px 12px 11px; background: var(--surface);
    border-top: 1px solid var(--border); }
  #q { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    font-size: 13.5px; outline: none; background: var(--surface-2); color: var(--text); }
  #q:focus { border-color: var(--accent); }
  #send { flex: none; border: none; background: var(--accent); color: var(--accent-ink);
    border-radius: 10px; padding: 0 15px; font-size: 13.5px; }
  #send:disabled { opacity: .45; cursor: default; }

  #fab { position: absolute; right: 16px; bottom: 16px; z-index: 1140; width: 52px; height: 52px;
    border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink);
    box-shadow: var(--shadow); display: none; place-items: center; }
  #fab.show { display: grid; }

  @media (max-height: 700px) {
    #panel { height: calc(100vh - 32px); }
    #phead { padding: 8px 12px; } #phead span { display: none; }
  }
  @media (max-width: 640px) {
    #panel { left: 12px; right: 12px; width: auto; height: 48vh; bottom: 12px; }
    #legend { display: none !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="searchwrap">
  <div id="searchcard" class="card">
    <div id="brand"><h1>🗺️ GeoMind AI</h1></div>
    <input id="search" placeholder="Search a district, area or neighbourhood…" autocomplete="off">
    <ul id="suggest"></ul>
    <div id="quick"><span>Featured:</span></div>
    <div id="badge"><span class="swatch"></span><span id="badgetext"></span></div>
  </div>
</div>

<button id="themebtn" class="iconbtn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>

<div id="legend" class="card">
  <div class="row"><i style="background:var(--school)"></i> Schools</div>
  <div class="row"><i style="background:var(--facility)"></i> Medical facilities</div>
  <div class="row" id="pinlegend" style="display:none"><i style="background:var(--accent)"></i> Your pin</div>
  <div id="legendExtra"></div>
</div>

<div id="panel" class="card">
  <div id="phead">
    <div><b>Ask GeoMind</b><span>Plain English → map answer</span></div>
    <button id="closechat" title="Hide chat" aria-label="Hide chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="msgs"></div>
  <div id="chips"></div>
  <div id="inrow">
    <input id="q" placeholder="Ask about schools & healthcare…" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>

<button id="fab" title="Open chat" aria-label="Open chat">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===================================================================
// GeoMind AI — web page (display only).
//
// All data loading, AI and GIS analysis happen in the Python API (api/app.py).
// This script only: shows the map, sends questions to the API, and draws what comes back.
// ===================================================================
const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
const API_URL = LOCAL ? "http://127.0.0.1:7860" : "https://rasta-api.onrender.com";   // Python API (Render)

const TILES = {
  light: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  dark:  "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
};

let AREA = null;          // the area payload from POST /area
let REF_POINT = null;     // [lon, lat] of the user's map pin
let lastDraw = null;      // last answer's map layers, redrawn after a theme change

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const isDark = () => document.documentElement.getAttribute("data-theme") === "dark";
const colors = () => ({ school: css("--school"), facility: css("--facility"), near: css("--near"),
  isolate: css("--isolate"), accent: css("--accent"), ring: isDark() ? "#0b1220" : "#ffffff" });

// ---- talking to the Python API ----
async function api(path, body, timeoutMs = 60000) {
  const res = await fetch(API_URL + path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
    signal: AbortSignal.timeout(timeoutMs),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `The analysis server returned ${res.status}.`);
  return data;
}

// ===================================================================
// MAP + THEME
// ===================================================================
const map = L.map("map", { zoomControl: true }).setView([25, 55], 4);
const basemaps = {};
function setBasemap(theme) {
  for (const t of ["light", "dark"]) {
    if (!basemaps[t]) {
      basemaps[t] = L.tileLayer(TILES[t], { attribution: "Tiles © Esri", maxNativeZoom: 16, maxZoom: 19,
        opacity: 0, className: "basemap" }).addTo(map);
      basemaps[t].bringToBack();
    }
  }
  basemaps.light.setOpacity(theme === "light" ? 1 : 0);
  basemaps.dark.setOpacity(theme === "dark" ? 1 : 0);
}
const baseLayer = L.layerGroup().addTo(map);
const highlight = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup().addTo(map);
const dot = c => ({ radius: 6, color: colors().ring, weight: 1.5, fillColor: c, fillOpacity: 1, bubblingMouseEvents: false });

const themeBtn = document.getElementById("themebtn");
const ICON_MOON = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const ICON_SUN = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("rasta-theme", t); } catch (e) {}
  themeBtn.innerHTML = t === "dark" ? ICON_SUN : ICON_MOON;
  setBasemap(t);
  if (AREA) { drawArea(false); if (lastDraw) renderDraw(lastDraw, false); }   // restyle only
}
themeBtn.onclick = () => applyTheme(isDark() ? "light" : "dark");

const panel = document.getElementById("panel"), fab = document.getElementById("fab");
function showChat(on) { panel.classList.toggle("hidden", !on); fab.classList.toggle("show", !on); }
document.getElementById("closechat").onclick = () => showChat(false);
fab.onclick = () => showChat(true);

map.on("click", e => {
  if (!AREA) return;
  REF_POINT = [e.latlng.lng, e.latlng.lat];
  drawPin();
  addMsg("Pin set. Ask things like “schools within 1 km of this location”.", "bot");
});
function drawPin() {
  pinLayer.clearLayers();
  document.getElementById("pinlegend").style.display = REF_POINT ? "flex" : "none";
  if (!REF_POINT) return;
  L.circleMarker([REF_POINT[1], REF_POINT[0]], { radius: 8, color: colors().ring, weight: 3,
    fillColor: colors().accent, fillOpacity: 1, bubblingMouseEvents: false }).bindTooltip("Your pin").addTo(pinLayer);
}

// ===================================================================
// SEARCH (Photon suggestions stay in the browser so typing feels instant)
// ===================================================================
const searchEl = document.getElementById("search"), suggestEl = document.getElementById("suggest");
let timer = null, results = [];
searchEl.addEventListener("input", () => {
  clearTimeout(timer);
  const q = searchEl.value.trim();
  if (q.length < 3) { suggestEl.innerHTML = ""; return; }
  timer = setTimeout(() => lookup(q), 300);
});
async function lookup(q) {
  try {
    const d = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=12`)).json();
    const seen = new Set();
    results = (d.features || [])
      .sort((a, b) => (b.properties.extent ? 1 : 0) - (a.properties.extent ? 1 : 0))
      .filter(f => { const p = f.properties, k = [p.name, p.city, p.state, p.country].join("|").toLowerCase();
                     if (seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, 6);
    suggestEl.innerHTML = "";
    results.forEach((f, i) => {
      const p = f.properties, li = document.createElement("li");
      li.innerHTML = `${p.name || "(unnamed)"}<small>${[p.city, p.state, p.country].filter(Boolean).join(", ")}</small>`;
      li.onclick = () => choose(i);
      suggestEl.appendChild(li);
    });
  } catch (e) { console.warn("search failed", e); }
}
function pulseSearch() {
  const c = document.getElementById("searchcard");
  c.classList.remove("pulse"); void c.offsetWidth; c.classList.add("pulse");
  searchEl.focus();
}

// ===================================================================
// LOADING AN AREA
// ===================================================================
async function loadArea(body, label) {
  setBadge("loading", body.featured ? "Loading…" : "Fetching live map data (can take up to 25 s)…");
  try {
    showArea(await api("/area", body));
    searchEl.value = label || AREA.place;
  } catch (e) {
    setBadge("warn", e.message);
  }
}
function choose(i) {
  const f = results[i]; if (!f) return;
  suggestEl.innerHTML = "";
  loadArea({ photon: { properties: f.properties, lonlat: f.geometry.coordinates } }, f.properties.name);
}

function showArea(payload) {
  AREA = payload; REF_POINT = null; lastDraw = null;
  highlight.clearLayers(); setLegendExtra([]);
  drawArea(true);
  document.getElementById("legend").style.display = "block";
  const c = payload.counts;
  setBadge(payload.sparse ? "warn" : payload.source === "Overture extract" ? "good" : "live",
    `${payload.source} · ${c.schools} schools · ${c.facilities} medical facilities`);
  addMsg(payload.message, "bot");
  renderChips(payload.suggestions);
  showChat(true);
}

function drawArea(fit) {
  const C = colors();
  baseLayer.clearLayers();
  const b = L.geoJSON(AREA.boundary, { style: { color: C.accent, weight: 2, fill: true, fillOpacity: .05 }, interactive: false }).addTo(baseLayer);
  L.geoJSON(AREA.facilities, { pointToLayer: (f, ll) => L.circleMarker(ll, dot(C.facility)).bindPopup(f.properties.name || "Medical facility") }).addTo(baseLayer);
  L.geoJSON(AREA.schools, { pointToLayer: (f, ll) => L.circleMarker(ll, dot(C.school)).bindPopup(f.properties.name || "School") }).addTo(baseLayer);
  drawPin();
  if (fit && map.getSize().x) { try { map.flyToBounds(b.getBounds(), { padding: [60, 60], duration: .8 }); } catch (e) {} }
}

function setBadge(kind, text) {
  const el = document.getElementById("badge");
  el.style.display = "flex";
  const sw = el.querySelector(".swatch, .spin");
  if (kind === "loading") { sw.className = "spin"; sw.style.background = ""; }
  else { sw.className = "swatch"; sw.style.background = kind === "good" ? "var(--near)" : kind === "live" ? "var(--isolate)" : "var(--facility)"; }
  document.getElementById("badgetext").textContent = text;
}

// ===================================================================
// DRAWING AN ANSWER — each layer has a role; the page only picks colours
// ===================================================================
function setLegendExtra(items) {
  const el = document.getElementById("legendExtra");
  el.innerHTML = "";
  const C = colors();
  for (const it of items) {
    const color = it.color || (it.role === "gap" ? C.isolate : "transparent");
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<i class="sq" style="background:${color}"></i> ${it.label}`;
    el.appendChild(row);
  }
}

function renderDraw(d, fit) {
  const C = colors();
  highlight.clearLayers();
  const lineColor = rel => rel === "within" ? C.near : rel === "beyond" ? C.isolate : C.accent;
  const hitColor = { hit_within: C.near, hit_beyond: C.isolate, hit_all: C.accent, hit_gap: C.isolate, worst: C.isolate };
  const bounds = [];

  for (const layer of d.layers) {
    const fc = layer.geojson, role = layer.role;
    for (const f of fc.features) {
      const g = f.geometry, p = f.properties || {};
      if (role === "buffer" || role === "ref_circle") {
        L.circle([g.coordinates[1], g.coordinates[0]], { radius: p.radius, interactive: false,
          color: role === "buffer" ? C.near : C.accent, weight: role === "buffer" ? 1 : 1.5,
          dashArray: role === "ref_circle" ? "6 5" : null, fillOpacity: role === "buffer" ? .05 : .04 }).addTo(highlight);
      } else if (role === "ref_point") {
        L.circleMarker([g.coordinates[1], g.coordinates[0]], { radius: 7, color: C.ring, weight: 2, fillColor: C.accent, fillOpacity: 1 })
          .bindTooltip(p.label || "").addTo(highlight);
        bounds.push([g.coordinates[1], g.coordinates[0]]);
      } else if (hitColor[role]) {
        const col = hitColor[role];
        L.circleMarker([g.coordinates[1], g.coordinates[0]], { radius: role === "worst" ? 10 : 9, color: col, weight: 3,
          fillColor: role === "hit_gap" ? C.school : col, fillOpacity: .9, bubblingMouseEvents: false })
          .bindPopup(p.label || "").addTo(highlight);
        bounds.push([g.coordinates[1], g.coordinates[0]]);
      } else if (role === "line") {
        L.polyline(g.coordinates.map(c => [c[1], c[0]]), { color: lineColor(p.relation || layer.relation),
          weight: 2, dashArray: "5 5", interactive: false }).addTo(highlight);
      }
    }
    if (role === "gap") {
      L.geoJSON(fc, { style: { stroke: false, fillColor: C.isolate, fillOpacity: .35 }, interactive: false }).addTo(highlight);
    } else if (role === "grid") {
      L.geoJSON(fc, { style: f => ({ stroke: false, fillColor: layer.ramp[f.properties.cls], fillOpacity: .5 }), interactive: false }).addTo(highlight);
    }
  }
  setLegendExtra(d.legend || []);

  // Zoom to the answer. A failed animation (e.g. a hidden tab with a zero-size map) must never hide the answer.
  if (!fit || !map.getSize().x) return;
  try {
    if (d.fit === "results" && bounds.length > 1) map.flyToBounds(L.latLngBounds(bounds).pad(0.3), { duration: .8 });
    else if (d.fit === "results" && bounds.length === 1) map.flyTo(bounds[0], 16, { duration: .8 });
    else map.flyToBounds(L.geoJSON(AREA.boundary).getBounds(), { padding: [60, 60], duration: .8 });
  } catch (e) { console.warn("map zoom skipped:", e); }
}

// ===================================================================
// CHAT
// ===================================================================
const msgs = document.getElementById("msgs"), qEl = document.getElementById("q"), sendEl = document.getElementById("send");
const chipsEl = document.getElementById("chips");
function addMsg(text, who, tag) {
  const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text;
  if (tag) { const t = document.createElement("span"); t.className = "tag"; t.textContent = tag; d.appendChild(t); }
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}
function renderChips(list) {
  chipsEl.innerHTML = "";
  (list || []).forEach(text => {
    const c = document.createElement("button"); c.className = "chip"; c.textContent = text;
    c.onclick = () => ask(text); chipsEl.appendChild(c);
  });
}
function getLocation() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("unsupported"));
    navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000, maximumAge: 60000 });
  });
}

let busy = false;
async function ask(question) {
  question = (question || "").trim();
  if (!question || busy) return;
  showChat(true);
  addMsg(question, "user"); qEl.value = "";
  busy = true; sendEl.disabled = true;
  const body = { question, area_id: AREA ? AREA.area_id : null, pin: REF_POINT };
  try {
    let r = await api("/ask", body);
    if (r.needs_location) {                       // the API needs the user's position for "near me"
      addMsg("Getting your location…", "bot");
      try { const pos = await getLocation(); body.me = [pos.coords.longitude, pos.coords.latitude]; }
      catch (e) { body.me_error = "denied"; }
      r = await api("/ask", body);
    }
    if (r.area) showArea(r.area);                 // the API moved to another area
    if (r.draw) { lastDraw = r.draw; renderDraw(r.draw, true); }
    const how = r.router === "keywords" ? " · keyword fallback" : "";
    addMsg(r.answer, "bot", r.tag ? r.tag + how : null);
    if (r.followups) renderChips(r.followups);
    if (r.needs_area) pulseSearch();
  } catch (e) {
    addMsg(e.message.includes("timed out") || e.name === "TimeoutError"
      ? "The analysis server took too long. It may be waking up — try again in a moment."
      : e.message, "bot");
  } finally { busy = false; sendEl.disabled = false; }
}
sendEl.onclick = () => ask(qEl.value);
qEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ask(qEl.value); } });

// ===================================================================
// STARTUP
// ===================================================================
let saved = null;
try { saved = localStorage.getItem("rasta-theme"); } catch (e) {}
applyTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
addMsg("Search for a location above — or tap a featured district — then ask about its schools and healthcare.", "bot");
renderChips(["Which schools and clinics are near me?", "Which areas have poor access to healthcare?", "Which school has the worst access to healthcare?"]);

(async () => {
  const slow = setTimeout(() => setBadge("loading", "Waking the analysis server…"), 1500);
  try {
    const featured = await api("/featured", null, 90000);
    clearTimeout(slow);
    if (!AREA) document.getElementById("badge").style.display = "none";
    const quick = document.getElementById("quick");
    for (const f of featured) {
      const b = document.createElement("button");
      b.className = "qchip"; b.textContent = f.name;
      b.onclick = () => { suggestEl.innerHTML = ""; loadArea({ featured: f.key }, f.name); };
      quick.appendChild(b);
    }
  } catch (e) {
    clearTimeout(slow);
    setBadge("warn", "The analysis server is unavailable right now. Please try again shortly.");
  }
})();
</script>
